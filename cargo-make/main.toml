extend = [
  { path = "./lint.toml" },
  { path = "./test.toml" },
  { path = "./check-minimal-versions.toml" },
]

[env]
RUSTFLAGS = ""
LEPTOS_OUTPUT_NAME = "ci" # allows examples to check/build without cargo-leptos
# rustc flags of the CI job, such as those of the erased mode (see
# .github/workflows/run-cargo-make-task.yml)
CI_RUSTFLAGS = { value = "", condition = { env_not_set = ["CI_RUSTFLAGS"] } }

[env.github-actions]
RUSTFLAGS = "-D warnings ${CI_RUSTFLAGS}"

[tasks.ci]
dependencies = ["lint", "test-each-feature", "doctests"]
